name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agentd/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Run static checks
        run: bash scripts/ci/check-static.sh

  robotd:
    name: robotd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "robotd/uv.lock"
      - name: Install Python dependencies
        working-directory: robotd
        run: uv sync --locked --extra dev --python 3.11
      - name: Run robotd checks
        run: bash scripts/ci/check-robotd.sh

  agentd:
    name: agentd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agentd/package-lock.json
      - name: Install Node dependencies
        run: npm ci --prefix agentd
      - name: Run agentd checks
        run: bash scripts/ci/check-agentd.sh

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agentd/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "robotd/uv.lock"
      - name: Install Python dependencies
        working-directory: robotd
        run: uv sync --locked --extra dev --python 3.11
      - name: Install agentd dependencies
        run: npm ci --prefix agentd
      - name: Run simulation integration
        run: bash scripts/ci/check-integration.sh

  # macOS lane (GH-36): the Linux lanes cannot compile Swift, so before this
  # job existed every `.swift` change was only grepped, never compiled. It runs
  # on the official arm64 macOS runner and touches no audio device, camera, or
  # TCC permission. `check-apple.sh` fails closed while the AEC3 sources are not
  # vendored; that is intentional, never a skip.
  apple:
    name: apple
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift compile, XCTest, and AEC3 build gate
        run: bash scripts/ci/check-apple.sh

  # Single required check for branch protection. It only passes when every
  # quality lane passes, and it still reports when an upstream lane fails.
  quality:
    name: quality
    if: always()
    needs:
      - static
      - robotd
      - agentd
      - integration
      - apple
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify all quality jobs passed
        env:
          STATIC: ${{ needs.static.result }}
          ROBOTD: ${{ needs.robotd.result }}
          AGENTD: ${{ needs.agentd.result }}
          INTEGRATION: ${{ needs.integration.result }}
          APPLE: ${{ needs.apple.result }}
        run: node scripts/ci/verify-lanes.mjs
