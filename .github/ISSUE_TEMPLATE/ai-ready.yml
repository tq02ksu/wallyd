name: AI-ready engineering task
description: Define a bounded, testable task for the Symphony/Codex loop
title: "[Task] "
labels:
  - ai-ready
body:
  - type: markdown
    attributes:
      value: |
        This task will be processed automatically in an isolated worktree.
        Do not include credentials, private data, or requests to operate real hardware.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable problem should be solved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable bullets. Each criterion should map to a test or inspection.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Public interfaces, modules, and behaviors that are in or out of scope.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Commands, simulations, contract checks, and expected evidence.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk class
      options:
        - Documentation or isolated unit change
        - Contract or cross-process behavior
        - Security, persistence, or process execution
        - Robot API or protocol design
        - Requires human hardware authorization
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: This task does not require real hardware operation.
          required: true
        - label: This task may proceed without changing `main`, merging a PR, or weakening tests.
          required: true

